<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C5DCE6">
<title>Your Name – Portfolio</title>
<meta name="description" content="Portfolio of a computer science student exploring software engineering, AI and practical technology development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --powder: #C5DCE6;
  --powder-soft: #D6E8EF;
  --powder-deep: #A8C8D4;
  --wine: #6B1521;
  --wine-deep: #4E0F18;
  --wine-muted: #8A3A45;
  --ink: #1F1215;
  --muted: #4A3A3E;
  --card: #F7FBFC;
  --border: rgba(107, 21, 33, 0.12);
  --shadow: 0 4px 20px rgba(31, 18, 21, 0.06);
  --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--powder);
  color: var(--ink);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--wine); color: #fff; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(197, 220, 230, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(107, 21, 33, 0.1);
}
.nav-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav-logo {
  font-weight: 700;
  font-size: 16px;
  color: var(--wine);
  letter-spacing: -0.02em;
}
.nav-links {
  display: flex;
  gap: 4px;
}
.nav-links a {
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--muted);
  transition: color 0.15s, background 0.15s;
}
.nav-links a:hover { color: var(--ink); background: rgba(107, 21, 33, 0.06); }
.nav-links a.on { color: var(--wine); background: rgba(107, 21, 33, 0.1); font-weight: 600; }

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 28px;
}
section {
  padding: 72px 0;
  border-bottom: 1px solid rgba(107, 21, 33, 0.08);
}
section:last-of-type { border-bottom: none; }
.section-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--wine-muted);
  margin-bottom: 10px;
}
.section-title {
  font-size: clamp(26px, 3.5vw, 32px);
  font-weight: 700;
  color: var(--wine);
  letter-spacing: -0.02em;
  margin-bottom: 32px;
}

.hero {
  padding: 96px 0 80px;
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  gap: 48px;
  align-items: center;
}
.hero-content h1 {
  font-size: clamp(36px, 5.5vw, 52px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--wine);
  margin-bottom: 12px;
}
.hero-role {
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 16px;
}
.hero-blurb {
  font-size: 16px;
  color: var(--muted);
  max-width: 42ch;
  margin-bottom: 28px;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-primary {
  background: var(--wine);
  color: #fff;
  border: 1.5px solid var(--wine);
}
.btn-primary:hover { background: var(--wine-deep); border-color: var(--wine-deep); }
.btn-secondary {
  background: transparent;
  color: var(--wine);
  border: 1.5px solid rgba(107, 21, 33, 0.25);
}
.btn-secondary:hover {
  background: rgba(107, 21, 33, 0.08);
  border-color: var(--wine);
}
.hero-photo {
  justify-self: end;
}
.photo-frame {
  width: 260px;
  height: 320px;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(160deg, var(--wine-muted), var(--powder-deep));
  border: 1px solid rgba(107, 21, 33, 0.15);
  box-shadow: var(--shadow);
  position: relative;
}
.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-frame .ini {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 64px;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
}
.about-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 48px;
}
.about-text p {
  color: var(--muted);
  margin-bottom: 14px;
  max-width: 54ch;
}
.about-text p:last-child { margin-bottom: 0; }
.interest-list {
  list-style: none;
  display: grid;
  gap: 8px;
}
.interest-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14.5px;
  color: var(--ink);
}
.interest-list li::before {
  content: "";
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--wine);
}
.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.skill-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 22px;
  box-shadow: var(--shadow);
}
.skill-card h3 {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--wine);
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.skill-card ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.skill-card li {
  font-size: 13px;
  padding: 4px 10px;
  background: rgba(107, 21, 33, 0.07);
  color: var(--ink);
  border-radius: 6px;
  font-weight: 500;
}
.projects-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.project-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px 28px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.project-card h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--wine);
  letter-spacing: -0.02em;
}
.project-kind {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--wine-muted);
  margin-top: 4px;
  margin-bottom: 12px;
}
.project-desc {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 16px;
  flex-grow: 1;
}
.project-features {
  list-style: none;
  display: grid;
  gap: 5px;
  margin-bottom: 16px;
}
.project-features li {
  font-size: 13.5px;
  color: var(--ink);
  padding-left: 14px;
  position: relative;
}
.project-features li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--wine-muted);
}
.project-stack {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 18px;
}
.project-stack strong {
  color: var(--ink);
  font-weight: 600;
}
.project-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--wine);
  transition: color 0.15s;
}
.project-link:hover { color: var(--wine-deep); }
.project-link svg { width: 14px; height: 14px; }
.edu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.edu-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.edu-card h3 {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  margin-bottom: 8px;
}
.edu-school {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--wine);
  margin-bottom: 6px;
}
.edu-meta {
  font-size: 13px;
  color: var(--muted);
}
.contact-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  text-align: center;
  box-shadow: var(--shadow);
}
.contact-box p {
  color: var(--muted);
  margin-bottom: 20px;
  max-width: 44ch;
  margin-left: auto;
  margin-right: auto;
}
.contact-email {
  display: inline-block;
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  color: var(--wine);
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  border-bottom: 2px solid transparent;
  transition: border-color 0.15s;
}
.contact-email:hover { border-bottom-color: var(--wine); }
.contact-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

footer {
  padding: 28px 0 40px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
    padding: 64px 0 56px;
    text-align: center;
  }
  .hero-blurb { margin-left: auto; margin-right: auto; }
  .hero-actions { justify-content: center; }
  .hero-photo { justify-self: center; order: -1; }
  .photo-frame { width: 200px; height: 240px; }
  .about-grid { grid-template-columns: 1fr; gap: 32px; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .projects-grid { grid-template-columns: 1fr; }
  .edu-grid { grid-template-columns: 1fr; }
  .nav-links { display: none; }
}
@media (max-width: 600px) {
  .wrap { padding: 0 18px; }
  section { padding: 56px 0; }
  .skills-grid { grid-template-columns: 1fr; }
  .nav-inner { padding: 0 18px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="#home" class="nav-logo" id="nav-logo"></a>
    <nav class="nav-links" id="nav" aria-label="Sections"></nav>
  </div>
</header>

<main>
  
  <div class="wrap">
    <section class="hero" id="home" style="border:none; padding-bottom:64px;">
      <div class="hero-content">
        <h1 id="name"></h1>
        <p class="hero-role" id="role"></p>
        <p class="hero-blurb" id="blurb"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
      <div class="hero-photo">
        <div class="photo-frame">
          <span class="ini" id="ini"></span>
          <img id="photo" alt="Portrait" onload="document.getElementById('ini').style.display='none'" onerror="this.remove()">
        </div>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section id="about">
      <p class="section-label">About</p>
      <h2 class="section-title">About me</h2>
      <div class="about-grid">
        <div class="about-text" id="about-body"></div>
        <div>
          <h3 style="font-size:14px; font-weight:600; color:var(--wine); margin-bottom:14px;">Areas of interest</h3>
          <ul class="interest-list" id="interests"></ul>
        </div>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section id="skills">
      <p class="section-label">Skills</p>
      <h2 class="section-title">Technical skills</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </section>
  </div>

  <div class="wrap">
    <section id="projects">
      <p class="section-label">Work</p>
      <h2 class="section-title">Selected projects</h2>
      <div class="projects-grid" id="proj-grid"></div>
    </section>
  </div>

  <div class="wrap">
    <section id="education">
      <p class="section-label">Background</p>
      <h2 class="section-title">Education</h2>
      <div class="edu-grid" id="edu-grid"></div>
    </section>
  </div>

  <div class="wrap">
    <section id="contact">
      <p class="section-label">Contact</p>
      <h2 class="section-title">Get in touch</h2>
      <div class="contact-box">
        <p>Open to technical discussions, collaboration and project opportunities.</p>
        <a class="contact-email" id="mail" href="#"></a>
        <div class="contact-actions" id="cbtns"></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p id="copy"></p>
  </div>
</footer>

<script>
const ME = {
  name: "Naznin Sultana Tonni",
  role: "CSE Student · Software Engineering & AI",
  affiliation: "BSc in CSE · United International University",
  blurb: "Exploring software engineering, AI and new technologies.",
  photo: "tonni.jpeg",
  resume: "resume.pdf",
  github: "https://github.com/Naznin754",
  linkedin: "https://linkedin.com/in/naznin-sultana-0a5088315",
  email: "nazninsultana28754@gmail.com",

  about: {
    long: [
  "I'm currently studying Computer Science and Engineering at United International University. Right now I'm figuring out which parts of tech I enjoy most exploring software, AI, systems, and everything in between.",
  "I like to learn by building things. I start with small ideas, get them working, then keep improving them."
],
    interests: [
      "Software engineering and full-stack development",
      "Artificial intelligence and machine learning",
      "Database design and backend systems",
      "Learning new technologies through real projects"
    ]
  },

  skills: {
    "Programming languages": ["Java", "JavaScript", "Python", "C/C++"],
    "Frontend development": ["React", "Next.js", "HTML", "CSS"],
    "Backend development": ["Node.js", "Express.js", "Spring Boot","PHP"],
    "Databases and ORM": ["PostgreSQL", "MySQL"],
    "Tools and platforms": ["Git", "GitHub", "Arduino IDE", "VS Code"],
    "Embedded systems & AI": ["ESP32", "Raspberry Pi", "Microcontrollers"]
  },

  projects: [
    {
    title: "Restaurant OS – Waitstaff Portal",
    kind: "Web Programming Project",
    desc: "A waitstaff management portal inspired by the idea “Anyone can cook.” Built for handling restaurant operations including tables, orders, shifts and staff profiles.",
    features: [
      "Table and order management",
      "Shift attendance tracking",
      "Staff profile management",
      "Clean HTML/CSS interface"
    ],
    stack: ["HTML", "CSS", "JavaScript", "PHP"],
    repo: "https://github.com/Naznin754/WebProgramming_Project"
  },
  {
    title: "A* Pathfinding Game",
    kind: "AI Course Project",
    desc: "A game built with group members where the player navigates to a goal destination using the A* search algorithm to find the optimal path where an enemy is chasing the player.",
    features: [
      "A* search algorithm implementation",
      "Player navigation toward goal",
      "Pathfinding visualization",
      "Interactive gameplay"
    ],
    stack: ["Python"],
    repo: "https://github.com/Naznin754/AI_Project"
  },
  {
    title: "Startup Incubator Platform",
    kind: "AOOP Course Project",
    desc: "A backend-focused platform for managing startup incubation — handling applications, mentoring and progress tracking using Spring Boot.",
    features: [
      "Startup application management",
      "Mentor and progress tracking",
      "Object-oriented design",
      "RESTful backend structure"
    ],
    stack: ["Java", "Spring Boot"],
  },
  {
    title: "Disaster Response & Relief Distribution",
    kind: "Database Management Project",
    desc: "A system for coordinating disaster response and relief distribution — managing aid requests, inventory and delivery records.",
    features: [
      "Relief request tracking",
      "Inventory and resource management",
      "Distribution records",
      "Database-driven workflows"
    ],
    stack: ["PHP", "HTML", "CSS", "MySQL"],
  },
  {
  title: "BONDHU – Assistive Companion Robot",
  kind: "Microprocessors & Microcontrollers Lab Project",
  desc: "A Bengali-speaking assistive companion robot for elderly care. It combines hardware sensing with a voice pipeline, fall detection, follow-me tracking and caregiver alerts.",
  features: [
    "Bangla voice pipeline (speech-to-text → LLM → text-to-speech)",
    "Fall detection with caregiver alerts via Telegram",
    "Follow-Me tracking using LD2450 mmWave radar",
    "Smartwatch health data stored in SQLite",
    "Caregiver dashboard and alert console"
  ],
  stack: ["Python", "Raspberry Pi 5", "LD2450 Radar", "SQLite", "Telegram API"],
  },
],
  education: [
    {
      degree: "Bachelor of Science in Computer Science and Engineering (CSE)",
      school: "United International University",
      years: "2023 – Present",
      note: "Bangladesh · Currently pursuing"
    },
    {
      degree: "Higher Secondary Certificate (HSC)",
      school: "Shaheed Bir Uttam Lt. Anwar Girls College",
      years: "2020 – 2022",
      note: "Science"
    },
    {
      degree: "Secondary School Certificate (SSC)",
      school: "Nawab Faizunnesa Government Girls High School",
      years: "2015 – 2020",
      note: "Science"
    }
  ]
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>';
const a = (href, txt, cls = "", extra = "") => `<a href="${esc(href)}" class="${cls}" ${extra}>${txt}</a>`;
const blank = 'target="_blank" rel="noopener"';

document.title = ME.name + " – Portfolio";
$("nav-logo").textContent = ME.name.split(" ")[0];
$("name").textContent = ME.name;
$("role").textContent = ME.role;
$("blurb").textContent = ME.blurb;
$("photo").src = ME.photo;
$("ini").textContent = ME.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

const secs = [
  ["home", "Home"],
  ["about", "About"],
  ["skills", "Skills"],
  ["projects", "Projects"],
  ["education", "Education"],
  ["contact", "Contact"]
];
$("nav").innerHTML = secs.map(([id, l]) => `<a href="#${id}" data-s="${id}">${l}</a>`).join("");

$("hero-actions").innerHTML =
  a(ME.resume, "Download resume", "btn btn-primary", "download") +
  a(ME.github, "GitHub", "btn btn-secondary", blank) +
  a(ME.linkedin, "LinkedIn", "btn btn-secondary", blank);

$("about-body").innerHTML = ME.about.long.map(p => `<p>${esc(p)}</p>`).join("");
$("interests").innerHTML = ME.about.interests.map(i => `<li>${esc(i)}</li>`).join("");

$("skills-grid").innerHTML = Object.entries(ME.skills).map(([k, v]) =>
  `<div class="skill-card">
    <h3>${esc(k)}</h3>
    <ul>${v.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
  </div>`
).join("");

$("proj-grid").innerHTML = ME.projects.map(p => `
  <article class="project-card">
    <h3>${esc(p.title)}</h3>
    <p class="project-kind">${esc(p.kind)}</p>
    <p class="project-desc">${esc(p.desc)}</p>
    <ul class="project-features">${p.features.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
    <p class="project-stack"><strong>Built with:</strong> ${p.stack.map(esc).join(", ")}</p>
    <a class="project-link" href="${esc(p.repo)}" ${blank}>View repository ${ext}</a>
  </article>
`).join("");

$("edu-grid").innerHTML = ME.education.map(e => `
  <div class="edu-card">
    <h3>${esc(e.degree)}</h3>
    <p class="edu-school">${esc(e.school)}</p>
    <p class="edu-meta">${esc(e.years)} · ${esc(e.note)}</p>
  </div>
`).join("");

$("mail").textContent = ME.email;
$("mail").href = "mailto:" + ME.email;
$("cbtns").innerHTML =
  a(ME.resume, "Download resume", "btn btn-primary", "download") +
  a(ME.linkedin, "LinkedIn", "btn btn-secondary", blank) +
  a(ME.github, "GitHub", "btn btn-secondary", blank);

$("copy").textContent = "© " + new Date().getFullYear() + " " + ME.name + ". All rights reserved.";

/* Active nav highlight */
const links = [...document.querySelectorAll("#nav a")];
const io = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      links.forEach(l => l.classList.toggle("on", l.dataset.s === e.target.id));
    }
  });
}, { rootMargin: "-35% 0px -55% 0px" });
secs.forEach(([id]) => {
  const el = $(id);
  if (el) io.observe(el);
});
</script>
</body>
</html>
